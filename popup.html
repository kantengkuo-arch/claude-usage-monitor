<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b;
        --track: #ececec; --accent: #c96442; --border: #ededed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1e1d; --fg: #f2f0ed; --muted: #a8a39d;
          --track: #34322f; --accent: #c96442; --border: #34322f;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 14px 16px 16px;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg); color: var(--fg); font-size: 13px;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
      .row { margin-bottom: 13px; }
      .row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
      .label { font-weight: 500; }
      .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
      .track { height: 7px; width: 100%; background: var(--track); border-radius: 99px; overflow: hidden; }
      .fill { height: 100%; border-radius: 99px; transition: width .3s ease; }
      .reset { font-size: 11px; color: var(--muted); margin-top: 4px; }
      .footer {
        margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
        font-size: 11px; color: var(--muted);
      }
      button {
        font: inherit; font-size: 11px; cursor: pointer; border: 1px solid var(--border);
        background: transparent; color: var(--fg); padding: 4px 10px; border-radius: 6px;
      }
      button:hover { background: var(--track); }
      button:disabled { opacity: .5; cursor: default; }
      .msg { color: var(--muted); line-height: 1.5; padding: 6px 0; }
      .msg a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>Claude Usage</h1>
    <div id="content"><div class="msg">Loading…</div></div>
    <div class="footer">
      <span id="updated"></span>
      <button id="refresh">Refresh</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
